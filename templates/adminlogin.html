<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - EduTutor</title>
    <style>
        body {
            font-family: Arial;
            background: #1e293b;
        }
        .form-container {
            width: 320px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #2563eb; }
        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>🔐 Admin Login</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/admin/login" method="POST">
    <input type="text"     name="username" placeholder="Admin Username" required>
    <input type="password" name="password" placeholder="Admin Password" required>
    <button type="submit">Login</button>
</form>
</div>
</body>
</html>
