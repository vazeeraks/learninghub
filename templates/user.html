<!DOCTYPE html>
<html>
<head>
    <title>Edit User - EduTutor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        h2 { color: #1e293b; margin-bottom: 24px; font-size: 22px; }

        label { display: block; font-size: 13px; color: #64748b;
                font-weight: bold; margin-bottom: 6px; }
        input {
            width: 100%; padding: 11px 14px; margin-bottom: 18px;
            border: 1px solid #cbd5e1; border-radius: 6px;
            font-size: 14px; outline: none; transition: border 0.2s;
        }
        input:focus { border-color: #3b82f6; }

        small { display: block; color: #94a3b8; font-size: 12px;
                margin-top: -14px; margin-bottom: 18px; }

        .error { background: #fee2e2; color: #991b1b; padding: 10px 14px;
                 border-radius: 6px; margin-bottom: 16px; font-size: 14px; }

        .actions { display: flex; gap: 10px; margin-top: 8px; }
        .btn-save {
            flex: 1; background: #3b82f6; color: white; padding: 12px;
            border: none; border-radius: 6px; cursor: pointer;
            font-size: 14px; font-weight: bold;
        }
        .btn-save:hover { background: #2563eb; }
        .btn-cancel {
            flex: 1; background: #e2e8f0; color: #475569; padding: 12px;
            border: none; border-radius: 6px; cursor: pointer;
            font-size: 14px; font-weight: bold; text-decoration: none;
            text-align: center; display: inline-block;
        }
        .btn-cancel:hover { background: #cbd5e1; }
    </style>
</head>
<body>
<div class="card">
    <h2>✏️ Edit User</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/admin/edit/{{ user.id }}" method="POST">

        <label>Username</label>
        <input type="text" name="username" value="{{ user.username }}" required>

        <label>New Password</label>
        <input type="password" name="password" placeholder="Leave blank to keep current">
        <small>Only fill this if you want to change the password.</small>

        <div class="actions">
            <button type="submit" class="btn-save">💾 Save Changes</button>
            <a href="/admin" class="btn-cancel">Cancel</a>
        </div>

    </form>
</div>
</body>
</html>
